<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoirMusic — Web Player</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--base:#121212;--surf:#181818;--card:#181818;--hover:#2a2a2a;--txt:#fff;--mut:#b3b3b3;--green:#1ed760;--green-h:#3be477;--line:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden}
.layout{height:100vh;display:grid;grid-template-rows:1fr 88px}
.top{display:flex;gap:8px;padding:8px;min-height:0}
aside{width:360px;min-width:300px;display:flex;flex-direction:column;gap:8px;min-height:0}
.box{background:var(--base);border-radius:8px}
.nav{padding:20px 12px 12px}
.logo{display:flex;align-items:center;gap:8px;padding:0 12px 18px;font-size:19px;font-weight:700;letter-spacing:-.5px}
.logo i{width:32px;height:32px;background:var(--green);border-radius:50%;display:grid;place-items:center;color:#000;font-style:normal;font-size:18px}
.logo em{font-style:normal;color:var(--green)}
.nl{display:flex;align-items:center;gap:16px;padding:8px 12px;color:var(--mut);font-weight:700;cursor:pointer;border-radius:4px}
.nl:hover,.nl.on{color:#fff}
.nl svg{width:24px;height:24px;flex-shrink:0}
.lib{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px}
.lib-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 12px;color:var(--mut);font-weight:700}
.lib-h .row{display:flex;align-items:center;gap:10px;cursor:pointer}.lib-h .row:hover{color:#fff}
.pills{display:flex;gap:8px;padding:0 8px 12px}
.pills span{background:#2a2a2a;border-radius:9999px;padding:7px 13px;font-size:13px;cursor:pointer}
.pills span.on{background:#fff;color:#000}
#liblist{overflow-y:auto;flex:1;min-height:0}
.pl{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
.pl:hover{background:var(--hover)}.pl.act{background:#2a2a2a}
.pl img{width:48px;height:48px;border-radius:4px;object-fit:cover;flex-shrink:0;background:#333}
.pl b{font-size:14px;font-weight:400;display:block}.pl.act b{color:var(--green)}
.pl small{color:var(--mut);font-size:13px}
main{flex:1;background:var(--base);border-radius:8px;overflow-y:auto;min-width:0;position:relative}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(18,18,18,.85);backdrop-filter:blur(12px)}
.abtn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.7);color:var(--mut);font-size:18px;cursor:pointer}
.sbox{flex:0 1 360px;display:flex;align-items:center;gap:10px;background:#2a2a2a;border-radius:9999px;padding:9px 14px;border:1px solid transparent}
.sbox:focus-within{border-color:#fff}
.sbox input{background:none;border:none;outline:none;color:#fff;width:100%;font-size:14px;font-family:inherit}
.sbox input::placeholder{color:#757575}
.sp{flex:1}
.btn-g{background:none;border:1px solid #878787;color:#fff;border-radius:9999px;padding:8px 26px;font-weight:700;font-size:14px;cursor:pointer}
.btn-g:hover{border-color:#fff;transform:scale(1.03)}
.btn-w{background:#fff;border:none;color:#000;border-radius:9999px;padding:9px 30px;font-weight:700;font-size:14px;cursor:pointer}
.btn-w:hover{background:#f0f0f0;transform:scale(1.03)}
.hero{background:linear-gradient(180deg,#3a3a5e 0%,var(--base) 100%);padding:10px 24px 8px}
h1{font-size:30px;font-weight:700;letter-spacing:-1px;margin:14px 0 18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.09);border-radius:6px;overflow:hidden;cursor:pointer;font-weight:700;height:64px;position:relative}
.tile:hover{background:rgba(255,255,255,.18)}
.tile img{width:64px;height:64px;object-fit:cover}
.tile .mini{position:absolute;right:8px;width:44px;height:44px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center;font-size:16px;opacity:0;transform:translateY(6px);transition:.18s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tile:hover .mini{opacity:1;transform:none}
.sec{padding:8px 24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 4px}
.sec-h h2{font-size:22px;font-weight:700;letter-spacing:-.5px;cursor:pointer}.sec-h h2:hover{text-decoration:underline}
.sec-h a{color:var(--mut);font-size:12px;font-weight:700;text-decoration:none;letter-spacing:1.5px;text-transform:uppercase}
.hint{color:var(--mut);font-size:13px;margin-bottom:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border-radius:8px;padding:14px;cursor:pointer;position:relative;transition:background .2s}
.card:hover{background:#282828}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card.round img{border-radius:50%}
.card b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb{position:absolute;right:22px;top:calc(100% - 118px);width:48px;height:48px;border-radius:50%;background:var(--green);border:none;color:#000;font-size:18px;display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card:hover .pb{opacity:1;transform:none}.pb:hover{background:var(--green-h);transform:scale(1.05)}
table{width:100%;border-collapse:collapse;margin:12px 0 30px}
th{color:var(--mut);font-weight:400;font-size:13px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky}
td{padding:8px 12px;font-size:14px}
td .timg{width:40px;height:40px;border-radius:4px;object-fit:cover}
tr.r{border-radius:4px}tr.r:hover td{background:rgba(255,255,255,.07);cursor:pointer}
tr.r td:first-child{border-radius:6px 0 0 6px;color:var(--mut);width:36px;text-align:center}
tr.r td:last-child{border-radius:0 6px 6px 0;color:var(--mut);text-align:right}
tr.r.play td:first-child,tr.r.play td:nth-child(2) b{color:var(--green)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;background:var(--green);animation:eq 1s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
footer{background:#000;border-top:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:14px}
.np{display:flex;align-items:center;gap:12px;width:28%;min-width:0}
.np img{width:56px;height:56px;border-radius:6px;object-fit:cover}
.np b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{color:var(--mut);font-size:12px}
.like{background:none;border:none;color:var(--mut);font-size:17px;cursor:pointer}.like.liked{color:var(--green)}
.mid{flex:1;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cb{display:flex;gap:20px;align-items:center}
.cb button{background:none;border:none;color:var(--mut);cursor:pointer;font-size:16px}
.cb button:hover{color:#fff}
.cb button.big{background:#fff;color:#000;width:34px;height:34px;border-radius:50%;font-size:15px;display:grid;place-items:center}
.cb button.big:hover{transform:scale(1.05)}
.cb button.green{color:var(--green)}
.pbar{display:flex;align-items:center;gap:8px;width:100%;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.tr{flex:1;height:4px;background:#4d4d4d;border-radius:99px;cursor:pointer;position:relative}
.tr:hover .fl{background:var(--green)}.tr:hover .fl::after{opacity:1}
.fl{height:100%;width:22%;background:#fff;border-radius:99px;position:relative}
.fl::after{content:'';position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
.rgt{width:28%;display:flex;justify-content:flex-end;gap:10px;align-items:center;color:var(--mut)}
.rgt .tr{max-width:100px}
::-webkit-scrollbar{width:12px}::-webkit-scrollbar-thumb{background:#ffffff30;border-radius:99px;border:3px solid var(--base)}::-webkit-scrollbar-thumb:hover{background:#ffffff50}
@media(max-width:1000px){aside{width:300px}.tiles{grid-template-columns:1fr 1fr}.rgt{display:none}.np{width:auto;flex:1}}
@media(max-width:700px){aside{display:none}.tiles{grid-template-columns:1fr}.topbar{padding:12px}.sec,.hero{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="layout">
<div class="top">
<aside>
<div class="box nav">
<div class="logo"><i>♪</i>Noir<em>Music</em></div>
<div class="nl on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-4v-6H10v6H6v-9H3z"/></svg>Beranda</div>
<div class="nl" onclick="document.getElementById('qq').focus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Cari</div>
</div>
<div class="box lib">
<div class="lib-h"><div class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h2v14H4zM10 5h2v14h-2zM16 5h4v14h-4z"/></svg> Koleksimu</div><span style="font-size:20px;cursor:pointer">+</span></div>
<div class="pills"><span class="on">Playlist</span><span>Artis</span><span>Album</span></div>
<div id="liblist"></div>
</div>
</aside>
<main id="main">
<div class="topbar">
<button class="abtn">‹</button><button class="abtn">›</button>
<div class="sbox"><span style="color:#b3b3b3">⌕</span><input id="qq" placeholder="Mau putar apa?" oninput="cari(this.value)"></div>
<div class="sp"></div>
<button class="btn-g">Daftar</button>
<button class="btn-w">Masuk</button>
</div>
<div class="hero">
<h1>Selamat sore</h1>
<div class="tiles" id="tiles"></div>
</div>
<div class="sec">
<div class="sec-h"><h2>Buatan Untukmu</h2><a href="#">Tampilkan semua</a></div>
<div class="hint">Mockup design ala open.spotify.com — data dummy lokal, tanpa backend.</div>
<div class="cards" id="cards"></div>
<div class="sec-h"><h2>Artis populer</h2><a href="#">Tampilkan semua</a></div>
<div class="cards" id="arts"></div>
<div class="sec-h"><h2>Lagu populer</h2></div>
<table><thead><tr><th>#</th><th style="width:36px"></th><th>Judul</th><th>Album</th><th style="text-align:right">⏱</th></tr></thead><tbody id="rows"></tbody></table>
</div>
</main>
</div>
<footer>
<div class="np"><img id="npi" src="https://picsum.photos/seed/noir-p0/112/112" alt=""><div style="min-width:0"><b id="npt">Pilih lagu untuk diputar</b><small id="npa">NoirMusic demo</small></div><button class="like" id="likebtn" onclick="this.classList.toggle('liked')">♥</button></div>
<div class="mid">
<div class="cb"><button id="shf" onclick="shfOn(this)" title="Acak">⇄</button><button onclick="prev()">⏮</button><button class="big" id="pp" onclick="toggle()">▶</button><button onclick="next()">⏭</button><button id="rpt" onclick="rptOn(this)" title="Ulangi">↻</button></div>
<div class="pbar"><span id="t0">0:45</span><div class="tr" onclick="seek(event)"><div class="fl" id="fill"></div></div><span id="t1">3:12</span></div>
</div>
<div class="rgt"><span>♪</span><div class="tr"><div class="fl" style="width:70%"></div></div><span>⛶</span></div>
</footer>
</div>
<script>
const IMG=s=>`https://picsum.photos/seed/${s}/200/200`;
const P=[
{n:"Senja di Jakarta",d:"Playlist • Noir Session",s:"noir-p1"},
{n:"Kopi Pagi Akustik",d:"Playlist • Santai",s:"noir-p2"},
{n:"Hujan & Piano",d:"Playlist • Fokus",s:"noir-p3"},
{n:"Lari Pagi 150 BPM",d:"Playlist • Energi",s:"noir-p4"},
{n:"Indie Indonesia",d:"Playlist • Kurator",s:"noir-p5"},
{n:"Lo-Fi Tidur",d:"Playlist • Beat lembut",s:"noir-p6"}];
const A=[
{n:"Payung Teduh",d:"Artis",s:"noir-a1"},
{n:"Tulus",d:"Artis",s:"noir-a2"},
{n:"Hindia",d:"Artis",s:"noir-a3"},
{n:"Kunto Aji",d:"Artis",s:"noir-a4"},
{n:"Sal Priadi",d:"Artis",s:"noir-a5"}];
const T=[
{t:"Langit Abu-Abu",al:"Senja di Jakarta",d:"3:12",sec:192,s:"noir-t1",ar:"Noir Session"},
{t:"Aroma Kopi",al:"Kopi Pagi",d:"2:58",sec:178,s:"noir-t2",ar:"Akustik Santai"},
{t:"Rintik",al:"Hujan & Piano",d:"4:05",sec:245,s:"noir-t3",ar:"Fokus Malam"},
{t:"Nafas Pagi",al:"Lari Pagi",d:"3:33",sec:213,s:"noir-t4",ar:"Energi"},
{t:"Pelita Kota",al:"Indie Indonesia",d:"3:47",sec:227,s:"noir-t5",ar:"Kurator"},
{t:"Juang",al:"Lo-Fi Tidur",d:"3:21",sec:201,s:"noir-t6",ar:"Beat Lembut"}];
let idx=0,playing=false,sec=45,total=192,timer=null,q="";
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
tiles.innerHTML=P.map((p,i)=>`<div class="tile" onclick="play(${i%T.length})"><img loading="lazy" src="${IMG(p.s)}" alt=""><span>${p.n}</span><span class="mini">▶</span></div>`).join('');
cards.innerHTML=P.map((p,i)=>`<div class="card" onclick="play(${i%T.length})"><img loading="lazy" src="${IMG(p.s)}" alt=""><button class="pb">▶</button><b>${p.n}</b><p>${p.d} • Demo dummy, update tiap minggu.</p></div>`).join('');
arts.innerHTML=A.map(a=>`<div class="card round"><img loading="lazy" src="${IMG(a.s)}" alt=""><b>${a.n}</b><p>${a.d}</p></div>`).join('');
liblist.innerHTML=P.map((p,i)=>`<div class="pl${i===0?' act':''}" onclick="play(${i%T.length},this)"><img loading="lazy" src="${IMG(p.s)}" alt=""><div><b>${p.n}</b><small>${p.d}</small></div></div>`).join('');
function renderRows(){
const list=T.map((s,i)=>({s,i})).filter(o=>(o.s.t+o.s.al+o.s.ar).toLowerCase().includes(q.toLowerCase()));
rows.innerHTML=list.map(o=>{
const on=o.i===idx&&playing;
const num=on?`<span class="eq"><i></i><i></i><i></i></span>`:o.i+1;
const tc=on?'play':'';
return `<tr class="r ${tc}" onclick="play(${o.i})"><td>${num}</td><td><img class="timg" loading="lazy" src="${IMG(o.s.s)}"></td><td><b>${o.s.t}</b><br><small style="color:#b3b3b3">${o.s.ar}</small></td><td style="color:#b3b3b3">${o.s.al}</td><td>${o.s.d}</td></tr>`}).join('');
}
function upd(){const s=T[idx];total=s.sec;npi.src=`https://picsum.photos/seed/${s.s}/112/112`;npt.textContent=s.t;npa.textContent=s.ar;t1.textContent=s.d;document.querySelectorAll('.pl').forEach((e,i)=>e.classList.toggle('act',i%T.length===idx));renderRows()}
function play(i,el){idx=i;sec=0;playing=true;pp.textContent="⏸";upd();start()}
function toggle(){playing=!playing;pp.textContent=playing?"⏸":"▶";playing?start():clearInterval(timer);renderRows()}
function next(){play((idx+1)%T.length)}function prev(){play((idx-1+T.length)%T.length)}
function start(){clearInterval(timer);timer=setInterval(()=>{sec++;if(sec>=total){next();return}fill.style.width=(sec/total*100)+"%";t0.textContent=fmt(sec)},1000)}
function seek(e){const r=e.currentTarget.getBoundingClientRect();sec=Math.floor((e.clientX-r.left)/r.width*total);fill.style.width=(sec/total*100)+"%";t0.textContent=fmt(sec)}
function cari(v){q=v;renderRows();cards.style.display=v?"none":"";arts.style.display=v?"none":"";document.querySelector('.hint').textContent=v?`Hasil untuk "${v}" — filter lokal.`:`Mockup design ala open.spotify.com — data dummy lokal, tanpa backend.`}
function shfOn(b){b.classList.toggle('green')}function rptOn(b){b.classList.toggle('green')}
document.addEventListener('keydown',e=>{if(e.code==="Space"&&document.activeElement!==qq){e.preventDefault();toggle()}});
upd();
</script>
</body>
</html>
