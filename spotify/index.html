<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noir Music — Web Player</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--surface:#181818;--surface2:#1f1f1f;--card:#252525;--text:#fff;--muted:#b3b3b3;--green:#1ed760;--border:#4d4d4d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.app{flex:1;display:flex;gap:8px;padding:8px;min-height:0}
aside{width:340px;min-width:280px;display:flex;flex-direction:column;gap:8px}
.panel{background:var(--surface);border-radius:8px;padding:16px}
.nav a{display:flex;align-items:center;gap:14px;padding:8px 4px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:700}
.nav a.active,.nav a:hover{color:#fff}
.logo{font-size:20px;font-weight:700;padding:4px 4px 16px;letter-spacing:-.5px}.logo span{color:var(--green)}
.search{margin-top:12px;background:var(--surface2);border-radius:9999px;padding:10px 14px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.search input{background:none;border:none;outline:none;color:#fff;width:100%;font-size:14px;font-family:inherit}
.lib{flex:1;overflow-y:auto}.lib h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:12px;color:var(--muted)}
.pl{display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}.pl:hover{background:var(--surface2)}
.cover{width:48px;height:48px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#000}
.pl b{font-size:14px;display:block}.pl small{color:var(--muted);font-size:12px}
main{flex:1;background:linear-gradient(#2a2a2a,var(--surface) 300px);border-radius:8px;overflow-y:auto;padding:24px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.arrows{display:flex;gap:12px}.arrows button{background:rgba(0,0,0,.5);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.login{background:#fff;border:none;border-radius:9999px;padding:10px 28px;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.5px}
h1{font-size:24px;font-weight:700;margin:8px 0 16px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:28px}
.tile{background:rgba(255,255,255,.08);border-radius:6px;display:flex;align-items:center;gap:12px;overflow:hidden;cursor:pointer;font-size:14px;font-weight:700}
.tile:hover{background:rgba(255,255,255,.15)}.tile .cover{width:64px;height:64px;border-radius:0}
h2{font-size:20px;font-weight:700;margin:0 0 4px}h2 small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin:14px 0 28px}
.card{background:var(--surface);border-radius:8px;padding:14px;cursor:pointer;transition:.2s;position:relative}
.card:hover{background:var(--card)}.card .art{width:100%;aspect-ratio:1;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:40px}
.card b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:13px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.playbtn{position:absolute;right:22px;bottom:78px;width:48px;height:48px;border-radius:50%;background:var(--green);border:none;font-size:20px;cursor:pointer;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card:hover .playbtn{opacity:1;transform:none}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th{color:var(--muted);font-weight:400;font-size:12px;text-align:left;padding:8px;border-bottom:1px solid #2a2a2a}
td{padding:10px 8px;border-radius:4px}tr[data-t]:hover td{background:rgba(255,255,255,.06);cursor:pointer}
tr.playing td:first-child{color:var(--green)}
footer{height:88px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px}
.np{display:flex;align-items:center;gap:12px;width:30%}.np .cover{width:56px;height:56px}
.np b{font-size:14px}.np small{color:var(--muted);font-size:12px}
.ctr{flex:1;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;gap:18px;align-items:center}.btns button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.btns button.big{background:#fff;color:#000;width:36px;height:36px;border-radius:50%;font-size:16px}
.bar{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;color:var(--muted)}
.track{flex:1;height:4px;background:#4d4d4d;border-radius:99px;cursor:pointer}.fill{height:100%;width:20%;background:#fff;border-radius:99px;position:relative}
.ctr:hover .fill{background:var(--green)}
.vol{width:30%;display:flex;justify-content:flex-end;gap:8px;align-items:center;color:var(--muted);font-size:14px}
@media(max-width:900px){aside{display:none}.grid6{grid-template-columns:1fr 1fr}.vol{display:none}.np{width:auto}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="panel nav">
<div class="logo">● Noir<span>Music</span></div>
<a href="#" class="active">⌂ Beranda</a>
<a href="#">◎ Cari</a>
<div class="search"><span>🔍</span><input id="q" placeholder="Mau putar apa?" oninput="cari(this.value)"></div>
</div>
<div class="panel lib">
<h3>▤ Koleksimu <span>+</span></h3>
<div id="liblist"></div>
</div>
</aside>
<main>
<div class="top">
<div class="arrows"><button>‹</button><button>›</button></div>
<button class="login">Masuk</button>
</div>
<h1>Selamat sore</h1>
<div class="grid6" id="tiles"></div>
<h2>Buatan Untukmu<small>Mockup design ala open.spotify.com — data dummy lokal</small></h2>
<div class="cards" id="cards"></div>
<h2>Lagu Teratas</h2>
<table><thead><tr><th>#</th><th>Judul</th><th>Album</th><th>⏱</th></tr></thead><tbody id="rows"></tbody></table>
</main>
</div>
<footer>
<div class="np"><div class="cover" id="npc" style="background:#1ed760">♪</div><div><b id="npt">Pilih lagu</b><br><small id="npa">—</small></div></div>
<div class="ctr">
<div class="btns"><button>🔀</button><button onclick="prev()">⏮</button><button class="big" id="pp" onclick="toggle()">▶</button><button onclick="next()">⏭</button><button>🔁</button></div>
<div class="bar"><span id="t0">0:00</span><div class="track" onclick="seek(event)"><div class="fill" id="fill"></div></div><span>3:45</span></div>
</div>
<div class="vol">🔊 <div class="track" style="max-width:100px"><div class="fill" style="width:70%"></div></div></div>
</footer>
<script>
const P=[
{n:"Senja di Jakarta",a:"Noir Session",c:"#1ed760",e:"🌆"},
{n:"Kopi Pagi",a:"Akustik Santai",c:"#e91e63",e:"☕"},
{n:"Hujan & Piano",a:"Fokus Malam",c:"#539df5",e:"🌧"},
{n:"Lari Pagi",a:"Energi 150 BPM",c:"#ffa42b",e:"🏃"},
{n:"Indie Indonesia",a:"Kuratormu",c:"#9c27b0",e:"🎸"},
{n:"Lo-Fi Tidur",a:"Beat Lembut",c:"#00bcd4",e:"🌙"}];
const T=[
{t:"Langit Abu-Abu",al:"Senja di Jakarta",d:"3:12"},
{t:"Aroma Kopi",al:"Kopi Pagi",d:"2:58"},
{t:"Rintik",al:"Hujan & Piano",d:"4:05"},
{t:"Nafas Pagi",al:"Lari Pagi",d:"3:33"},
{t:"Pelita Kota",al:"Indie Indonesia",d:"3:47"}];
let idx=0,playing=false,sec=45,timer=null;
tiles.innerHTML=P.map((p,i)=>`<div class="tile" onclick="main(${i})"><div class="cover" style="background:${p.c}">${p.e}</div>${p.n}</div>`).join('');
cards.innerHTML=P.map((p,i)=>`<div class="card" onclick="main(${i})"><div class="art" style="background:${p.c}">${p.e}</div><button class="playbtn">▶</button><b>${p.n}</b><p>${p.a} • Playlist dummy</p></div>`).join('');
liblist.innerHTML=P.map((p,i)=>`<div class="pl" onclick="main(${i})"><div class="cover" style="background:${p.c}">${p.e}</div><div><b>${p.n}</b><small>Playlist • ${p.a}</small></div></div>`).join('');
function renderRows(f=""){rows.innerHTML=T.map((s,i)=>({s,i})).filter(o=>o.s.t.toLowerCase().includes(f.toLowerCase())).map(o=>`<tr data-t class="${o.i===idx&&playing?'playing':''}" onclick="play(${o.i})"><td>${o.i===idx&&playing?'♫':o.i+1}</td><td><b>${o.s.t}</b><br><small style="color:#b3b3b3">${P[o.i%P.length].a}</small></td><td style="color:#b3b3b3">${o.s.al}</td><td style="color:#b3b3b3">${o.s.d}</td></tr>`).join('')}
function cari(v){renderRows(v)}
function upd(){const p=P[idx%P.length],s=T[idx%T.length];npc.style.background=p.c;npc.textContent=p.e;npt.textContent=s.t;npa.textContent=p.a;renderRows(q.value)}
function play(i){idx=i;playing=true;pp.textContent="⏸";upd();start()}
function main(i){play(i%T.length)}
function toggle(){playing=!playing;pp.textContent=playing?"⏸":"▶";playing?start():clearInterval(timer);upd()}
function next(){play((idx+1)%T.length)}function prev(){play((idx-1+T.length)%T.length)}
function start(){clearInterval(timer);timer=setInterval(()=>{sec=(sec+1)%225;fill.style.width=(sec/225*100)+"%";t0.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")},1000)}
function seek(e){const r=e.currentTarget.getBoundingClientRect();sec=Math.floor((e.clientX-r.left)/r.width*225);fill.style.width=(sec/225*100)+"%"}
renderRows();
</script>
</body>
</html>
